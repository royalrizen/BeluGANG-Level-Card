<svg xmlns="http://www.w3.org/2000/svg" width="432" height="176" viewBox="0 0 432 176">
  <defs>
    <clipPath id="card">
      <rect width="432" height="176" rx="8"/>
    </clipPath>
    <clipPath id="iconClip">
      <circle cx="57" cy="83" r="29"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="432" height="176" rx="8" fill="#232428"/>

    <text x="20" y="28"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11" font-weight="700"
          letter-spacing=".5" fill="#b5bac1">
      YOU'VE BEEN INVITED TO JOIN
    </text>

    <!-- Actual Discord server icon -->
    <image
      href="https://cdn.discordapp.com/icons/846496831533088768/d9ffe579a22b9f41e25d3c4e08f89e0b.png?size=128"
      x="28" y="54" width="58" height="58"
      clip-path="url(#iconClip)"
      preserveAspectRatio="xMidYMid slice"/>

    <!-- Server name -->
    <text x="101" y="80"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18" font-weight="700"
          fill="#f2f3f5">BeluGANG</text>

    <text x="101" y="101"
          font-family="Arial, Helvetica, sans-serif"
          font-size="12" fill="#b5bac1">
      Discord Server
    </text>

    <line x1="20" y1="125" x2="412" y2="125"
          stroke="#3f4147" stroke-width="1"/>

    <!-- Join button -->
    <rect x="20" y="138" width="392" height="28"
          rx="4" fill="#248046"/>

    <text x="216" y="156"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="600"
          text-anchor="middle" fill="#ffffff">
      Join Server
    </text>
  </g>
</svg>
